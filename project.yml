name: Thryve
options:
  bundleIdPrefix: com.thryve
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_CFBundleDisplayName: Thryve
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  Thryve:
    type: application
    platform: iOS
    sources:
      - path: Thryve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thryve.app
        INFOPLIST_FILE: Thryve/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Thryve finds your Gardyn on your network and talks to it directly. Nothing goes through the internet."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""  # set your own Apple team ID
        PRODUCT_NAME: Thryve

  ThryveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThryveTests
    dependencies:
      - target: Thryve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thryve.app.tests

schemes:
  Thryve:
    build:
      targets:
        Thryve: all
    test:
      targets:
        - ThryveTests
